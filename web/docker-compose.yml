services:

  web_1:
    build: ./web_1
    ports:
      - "9001:80"
    restart: always

  web_2:
    build: ./web_2
    ports:
      - "9002:80"
    restart: always

  web_3:
    build: ./web_3
    ports:
      - "9003:9000"
    restart: always

  web_4:
    build: ./web_4
    ports:
      - "9004:80"
    restart: always

  web_5:
    build: ./web_5
    ports:
      - "9005:9000"
    restart: always

  web_6:
    build: ./web_6
    ports:
      - "9006:80"
    restart: always

  web_7:
    build: ./web_7
    ports:
      - "9007:9000"
    restart: always

  web_8:
    build: ./web_8
    ports:
      - "9008:9000"
    restart: always

  web_9:
    build: ./web_9
    ports:
      - "9009:9000"
    restart: always

  web_10:
    build: ./web_10
    ports:
      - "9010:9000"
    restart: always

  web_1_db:
    image: mariadb:10.5
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ctf_db
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    # web_1 uses 'db' as hostname, let's network it
    networks:
      - default

networks:
  default:
